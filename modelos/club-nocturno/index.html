<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonPulse | Kingdom of the Night</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Outfit:wght@200;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon: #ff0055;
            --cyan: #00f2ff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #000;
            color: #fff;
        }

        .font-sync {
            font-family: 'Syncopate', sans-serif;
        }

        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .neon-text {
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
        }

        .neon-border {
            border: 1px solid var(--neon);
            box-shadow: 0 0 15px var(--neon), inset 0 0 5px var(--neon);
        }

        .cyan-glow {
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }

        .noise {
            background-image: url('https://www.transparenttextures.com/patterns/black-linen.png');
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                opacity: 0.4;
            }
        }

        .animate-pulse-fast {
            animation: pulse 2s infinite ease-in-out;
        }
    </style>
</head>

<body class="noise overflow-x-hidden">
    <nav
        class="fixed top-0 w-full z-50 p-12 flex justify-between items-center bg-black/40 backdrop-blur-3xl border-b border-white/5">
        <div class="text-3xl font-sync font-bold tracking-tighter italic uppercase">NEON<span
                class="text-[#ff0055] neon-text">PULSE</span></div>
        <div class="hidden lg:flex space-x-12 text-[10px] font-sync font-bold uppercase tracking-[0.5em] text-white/30">
            <a href="#tonight" class="hover:text-cyan-400 transition">Agenda</a>
            <a href="#vip" class="hover:text-cyan-400 transition">Private</a>
            <a href="#gallery" class="hover:text-cyan-400 transition">Visuals</a>
        </div>
        <button
            class="neon-border px-10 py-3 font-sync font-bold text-[10px] uppercase tracking-widest hover:bg-[#ff0055] hover:text-black transition duration-700">VIP
            Access</button>
    </nav>

    <header class="h-screen relative flex items-center justify-center p-10 overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80"
                class="w-full h-full object-cover grayscale brightness-50 opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-black"></div>
        </div>

        <div class="relative z-10 text-center reveal" id="hero-content">
            <h1 class="text-7xl md:text-[18vw] font-sync font-bold leading-none mb-4 lowercase tracking-tighter italic">
                NEON <br> <span class="text-[#00f2ff] italic opacity-80">NIGHTS.</span></h1>
            <p class="text-xl md:text-2xl font-sync font-light tracking-[0.6em] text-white/20 uppercase mb-20 italic">
                The Kingdom of Silence is over.</p>
            <div class="flex flex-col sm:flex-row justify-center gap-10">
                <button
                    class="bg-[#ff0055] text-black px-16 py-6 font-sync font-bold uppercase text-[11px] tracking-widest hover:bg-white transition">Get
                    Tickets</button>
                <button
                    class="border border-white/10 px-16 py-6 font-sync font-bold uppercase text-[11px] tracking-widest hover:bg-white/10 transition italic">Table
                    Reservation</button>
            </div>
        </div>
    </header>

    <section id="tonight" class="py-60 bg-black px-10 overflow-hidden">
        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-32 items-center">
            <div class="reveal">
                <span class="text-[10px] font-sync font-bold text-cyan-400 uppercase tracking-[0.5em] mb-10 block">Sound
                    Architecture</span>
                <h2 class="text-6xl md:text-9xl font-sync font-bold mb-16 leading-tight uppercase italic scale-y-110">
                    Destrucción <br> <span class="text-[#ff0055] neon-text italic">Sónica.</span></h2>
                <div class="space-y-6">
                    <div
                        class="p-10 border border-white/5 bg-zinc-950/50 hover:border-cyan-400 transition-all group reveal cursor-pointer">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="text-[10px] font-sync text-cyan-400 mb-2">FRIDAY / 00:00</div>
                                <h3
                                    class="text-4xl font-sync font-bold italic group-hover:tracking-widest transition-all">
                                    TECHNO GOTH</h3>
                            </div>
                            <span
                                class="text-xs font-bold border border-white/10 px-6 py-2 opacity-20 group-hover:opacity-100 transition">SOON</span>
                        </div>
                    </div>
                    <div class="p-10 border border-white/5 bg-zinc-950/50 hover:border-[#ff0055] transition-all group reveal cursor-pointer"
                        style="transition-delay: 0.2s">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="text-[10px] font-sync text-[#ff0055] mb-2">SATURDAY / 23:00</div>
                                <h3
                                    class="text-4xl font-sync font-bold italic group-hover:tracking-widest transition-all">
                                    NEON RITUAL</h3>
                            </div>
                            <span
                                class="text-xs font-bold border border-white/10 px-6 py-2 opacity-20 group-hover:opacity-100 transition">BOOK</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="reveal relative" style="transition-delay: 0.3s">
                <div class="aspect-square rounded-full border border-white/5 p-4 animate-pulse-fast">
                    <div
                        class="w-full h-full rounded-full overflow-hidden grayscale brightness-50 cyan-glow border border-cyan-400/20">
                        <img src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=1200&q=80"
                            class="w-full h-full object-cover">
                    </div>
                </div>
                <div
                    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-9xl font-sync font-bold italic opacity-10 select-none">
                    CLUB</div>
            </div>
        </div>
    </section>

    <footer id="vip" class="py-60 bg-zinc-950 text-center px-10 border-t border-white/5">
        <div class="max-w-5xl mx-auto reveal">
            <h2 class="text-6xl md:text-[12vw] font-sync font-bold mb-16 italic uppercase leading-none text-transparent border-text"
                style="-webkit-text-stroke: 1px #ff0055;">ELITE <br> REALM.</h2>
            <p class="text-xl text-gray-700 mb-24 max-w-lg mx-auto italic font-light">Acceso restringido. Solo
                invitados. Solo noche.</p>
            <button
                class="neon-border bg-black text-white px-24 py-8 font-sync font-bold text-xl hover:bg-[#ff0055] hover:text-black transition">Apply
                for VIP Card</button>
            <div class="mt-40 text-[9px] font-sync font-bold text-gray-900 uppercase tracking-[1em]">NeonPulse &copy;
                Benidorm - Berlin - Tokyo</div>
        </div>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        document.getElementById('hero-content').classList.add('active');
    </script>
</body>

</html>
